[design]
name          = "freq_counter"
description   = "24-bit edge counters on UART_RX, UART_CTS, GPIO26 (free-running or 1 s gate); 1 kHz test output on GPIO27"
version       = "001"
design_id     = 5
kind          = "user"
clock_hz      = 31250000
capabilities  = ["IO_BUFFER"]
repository    = "wilifpga"

# One mode per header signal (docs/fwfpga-format.md): PASS_OUT PASS_IN FPGA_OUT
# FPGA_IN LINK_RP2F LINK_F2RP OFF. The shell, the ID block and the .fwfpga
# header are all generated from this table.
[io_profile]
spi_miso = "PASS_IN"
spi_cs   = "PASS_OUT"
spi_sclk = "PASS_OUT"
spi_mosi = "PASS_OUT"
uart_tx  = "PASS_OUT"
uart_rx  = "FPGA_IN"
uart_cts = "FPGA_IN"
uart_rts = "PASS_OUT"
gpio26   = "FPGA_IN"
gpio27   = "FPGA_OUT"
